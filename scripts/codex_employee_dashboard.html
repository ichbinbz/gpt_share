<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>员工账号与令牌查询</title>
<style>body{font:15px system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}h2{font-size:20px}section,article{background:white;border:1px solid #dce3ed;border-radius:12px;padding:18px;margin:16px 0}p{color:#536176}form{display:flex;flex-wrap:wrap;gap:10px}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #b8c5d5}button{background:#1769c2;color:white;border-color:#1769c2;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px;border-bottom:1px solid #e6ebf1}th{background:#f5f7fb}.scroll{overflow:auto}.card-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}strong{font-weight:700}.muted{color:#65758a}.error{color:#a62929}.token{overflow-wrap:anywhere;background:#f3f6fb;padding:12px;border-radius:8px}#accounts article{margin:12px 0}small{color:#65758a}</style></head><body><main>
<h1>员工账号与令牌查询</h1><p>账号额度和模型状态无需令牌即可查看。逐模型 Token 用量从升级后的客户端上报开始累计。</p>
<section><div class="card-head"><h2>登录账号、额度与模型用量</h2><button id="refresh" type="button">刷新</button></div><p id="updated" class="muted">正在加载…</p><div id="accounts"></div></section>
<section><h2>已有员工查询令牌</h2><p>输入用户名（如 YX.GUO）和工号。令牌只显示在当前页面，请妥善保存。</p><form id="query"><input name="username" placeholder="用户名" required autocomplete="username"><input name="password" type="password" placeholder="工号" required autocomplete="off"><button>查询令牌</button></form><p id="query-result"></p></section>
<section><h2>新员工申请令牌</h2><p>填写姓名和工号。管理员审批后，可在下方领取令牌。</p><form id="apply"><input name="employee_name" placeholder="姓名" required maxlength="64"><input name="employee_id" placeholder="工号" required maxlength="64"><button>提交申请</button></form><p id="apply-result"></p></section>
<section><h2>领取已批准令牌</h2><form id="claim"><input name="employee_name" placeholder="申请时填写的姓名" required maxlength="64"><input name="employee_id" placeholder="工号" required maxlength="64"><button>领取令牌</button></form><p id="claim-result"></p></section>
</main><script>
const el=id=>document.getElementById(id);const add=(parent,tag,value,cls)=>{const child=document.createElement(tag);child.textContent=value??'—';if(cls)child.className=cls;parent.append(child);return child};const number=value=>Number(value||0).toLocaleString('zh-CN');
async function load(){el('refresh').disabled=true;try{const response=await fetch('/v1/public/accounts',{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);const data=await response.json();el('updated').textContent=`更新：${new Date(data.fetched_at*1000).toLocaleString()}`;const root=el('accounts');root.replaceChildren();for(const account of data.accounts||[]){const card=add(root,'article','');card.textContent='';const head=add(card,'div','', 'card-head');add(head,'strong',account.username||'账号');add(head,'span',account.available?'可用':'暂不可用');const rate=account.rate_limit||{};for(const [label,window] of [['主额度',rate.primary_window],['次额度',rate.secondary_window]]){if(window&&typeof window==='object')add(card,'p',`${label}：已用 ${window.used_percent??'—'}% · 重置 ${window.reset_at?new Date(window.reset_at*1000).toLocaleString():'—'}`)}const models=[...(account.models||[]),...(account.unlisted_model_usage||[])];if(!models.length){add(card,'p','暂无模型数据','muted');continue}const wrap=add(card,'div','', 'scroll');wrap.textContent='';const table=add(wrap,'table','');table.textContent='';const row=add(table,'tr','');row.textContent='';for(const title of ['模型','状态','探测成功','输入 Token','输出 Token','总 Token'])add(row,'th',title);for(const model of models){const tr=add(table,'tr','');tr.textContent='';add(tr,'td',model.name);add(tr,'td',model.available===true?'可用':model.available===false?'不可用':model.status||'未探测');add(tr,'td',model.probe_attempts?`${model.probe_successes||0}/${model.probe_attempts}`:'—');add(tr,'td',number(model.token_usage?.input_tokens));add(tr,'td',number(model.token_usage?.output_tokens));add(tr,'td',number(model.token_usage?.total_tokens))}}}catch(error){el('updated').textContent=`加载失败：${error.message}`}finally{el('refresh').disabled=false}}
async function send(form,url,target){const output=el(target);output.textContent='处理中…';output.className='muted';const button=form.querySelector('button');button.disabled=true;try{const body=Object.fromEntries(new FormData(form));const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.detail||`HTTP ${response.status}`);output.textContent='';if(data.device_token){add(output,'span',`用户名：${data.username} · 令牌：${data.device_token}`,'token')}else output.textContent='申请已提交，等待管理员审批。'}catch(error){output.textContent=error.message;output.className='error'}finally{button.disabled=false}}
el('query').addEventListener('submit',event=>{event.preventDefault();send(event.currentTarget,'/v1/token/query','query-result')});el('apply').addEventListener('submit',event=>{event.preventDefault();send(event.currentTarget,'/v1/token/applications','apply-result')});el('claim').addEventListener('submit',event=>{event.preventDefault();send(event.currentTarget,'/v1/token/applications/claim','claim-result')});el('refresh').addEventListener('click',load);load();setInterval(load,60000);
</script></body></html>
